<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FIT24 Member Portal | Digital Membership Card</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="bg-[#050505] text-zinc-100 antialiased min-h-screen flex flex-col items-center justify-center p-4">

  <div class="max-w-md w-full">
    <!-- Header -->
    <div class="flex items-center justify-between mb-6">
      <a href="index.html" class="flex items-center gap-2">
        <div class="w-9 h-9 bg-[#ff0033] flex items-center justify-center font-gymbox text-2xl text-white">
          24
        </div>
        <span class="font-gymbox text-2xl tracking-wider text-white">FIT24</span>
      </a>
      <a href="index.html" class="text-xs text-zinc-400 hover:text-white font-mono">← Home</a>
    </div>

    <!-- Quick Switcher for Demo -->
    <div class="mb-4 bg-black p-3 border border-white/10 flex items-center justify-between text-xs font-mono">
      <span class="text-zinc-400">Switch Demo:</span>
      <div class="space-x-1">
        <button onclick="loadMember('F24-1001')" class="px-2 py-1 bg-yellow-400 text-black text-[10px] font-bold">Elite</button>
        <button onclick="loadMember('F24-1002')" class="px-2 py-1 bg-[#ff0033] text-white text-[10px] font-bold">Prime</button>
        <button onclick="loadMember('F24-1004')" class="px-2 py-1 bg-amber-500 text-black text-[10px] font-bold">Paused</button>
      </div>
    </div>

    <!-- Digital Card Container -->
    <div id="member-card-wrapper" class="space-y-4"></div>

    <!-- Action Shortcuts -->
    <div class="mt-6 grid grid-cols-2 gap-3 text-center font-mono">
      <a href="https://wa.me/916238920442?text=Hi%20FIT24,%20I%20would%20like%20to%20request%20a%20membership%20pause" target="_blank"
         class="p-3 bg-black hover:bg-[#ff0033] border border-white/10 hover:border-[#ff0033] text-xs font-bold text-zinc-300 hover:text-white transition-all">
        ⏸ Request Pause
      </a>
      <a href="https://wa.me/916238920442?text=Hi%20FIT24,%20I%20would%20like%20to%20reserve%20a%20Sauna%20/%20Ice%20Bath%20slot" target="_blank"
         class="p-3 bg-black hover:bg-[#ff0033] border border-white/10 hover:border-[#ff0033] text-xs font-bold text-zinc-300 hover:text-white transition-all">
        🧖 Book Recovery Slot
      </a>
    </div>

    <div class="mt-8 text-center text-xs text-zinc-500 font-mono">
      FIT24 Premium Fitness Club · TB Road, Hosdurg, Kanhangad
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/supabase.js"></script>
  <script src="js/data.js"></script>
  <script>
    function loadMember(id) {
      const member = window.fit24Store.getMember(id) || window.fit24Store.getMembers()[0];
      const wrapper = document.getElementById("member-card-wrapper");
      if (!wrapper || !member) return;

      const saunaRem = member.saunaTotal - member.saunaUsed;
      const iceBathRem = member.iceBathTotal - member.iceBathUsed;
      const guestRem = member.guestPassesTotal - member.guestPassesUsed;

      let tierBadge = member.tier === "ELITE" 
        ? "bg-yellow-400 text-black border-yellow-400" 
        : member.tier === "PRIME" 
        ? "bg-[#ff0033] text-white border-[#ff0033]" 
        : "bg-white text-black border-white";

      wrapper.innerHTML = `
        <div class="bg-black border-2 border-[#ff0033] p-6 text-white shadow-2xl relative overflow-hidden">
          <div class="absolute -right-6 -bottom-6 text-9xl font-gymbox text-white/[0.03] select-none pointer-events-none">
            24
          </div>

          <div class="flex items-center justify-between mb-4">
            <div>
              <span class="text-[9px] uppercase font-mono tracking-widest text-[#ff0033] block font-bold">DIGITAL PASS · KANHANGAD</span>
              <h3 class="text-3xl font-gymbox text-white tracking-wide">${member.name}</h3>
            </div>
            <span class="px-3 py-1 text-xs font-gymbox uppercase border ${tierBadge}">
              ${member.tier}
            </span>
          </div>

          <div class="grid grid-cols-2 gap-2 text-xs mb-4 p-3 bg-white/5 border border-white/10 font-mono">
            <div><span class="text-zinc-500 block text-[9px]">MEMBER CODE</span> <strong class="text-white">${member.id}</strong></div>
            <div><span class="text-zinc-500 block text-[9px]">STATUS</span> <strong class="${member.isPaused ? 'text-amber-400' : 'text-emerald-400'}">${member.isPaused ? '⏸ PAUSED' : '● ACTIVE'}</strong></div>
            <div><span class="text-zinc-500 block text-[9px]">VALID UNTIL</span> <strong class="text-zinc-300">${member.endDate}</strong></div>
            <div><span class="text-zinc-500 block text-[9px]">CAFÉ CREDITS</span> <strong class="text-[#ff0033]">₹${member.cafeCredit.toFixed(2)}</strong></div>
          </div>

          <!-- Quotas -->
          <div class="space-y-2 mb-5 p-3.5 bg-white/5 border border-white/5 font-mono">
            <div class="text-[9px] font-bold text-[#ff0033] uppercase tracking-widest">RECOVERY QUOTA PASSBOOK</div>
            <div class="flex items-center justify-between text-xs">
              <span class="text-zinc-300">🧖 Sauna Sessions:</span>
              <strong class="text-white">${saunaRem} / ${member.saunaTotal} remaining</strong>
            </div>
            <div class="flex items-center justify-between text-xs">
              <span class="text-zinc-300">🧊 Ice Bath Plunges:</span>
              <strong class="text-white">${iceBathRem} / ${member.iceBathTotal} remaining</strong>
            </div>
            <div class="flex items-center justify-between text-xs">
              <span class="text-zinc-300">🎟 Guest Passes:</span>
              <strong class="text-white">${guestRem} / ${member.guestPassesTotal} remaining</strong>
            </div>
            <div class="flex items-center justify-between text-xs">
              <span class="text-zinc-300">☕ Café Discount:</span>
              <strong class="text-[#ff0033]">${member.cafeDiscount}% OFF automatically</strong>
            </div>
          </div>

          <!-- QR -->
          <div class="pt-3 border-t border-white/10 flex items-center justify-between">
            <div class="text-[10px] font-mono text-zinc-400">
              Present at Reception Counter<br>
              <span class="text-zinc-500">TB Road, Hosdurg, Kanhangad</span>
            </div>
            <div class="w-14 h-14 bg-white p-1.5 flex flex-col justify-between items-center shadow-lg">
              <div class="w-full flex justify-between"><div class="w-2.5 h-2.5 bg-black"></div><div class="w-2.5 h-2.5 bg-black"></div></div>
              <span class="text-[7px] font-mono text-black font-black uppercase">${member.id}</span>
              <div class="w-full flex justify-between"><div class="w-2.5 h-2.5 bg-black"></div><div class="w-2.5 h-2.5 bg-black"></div></div>
            </div>
          </div>
        </div>
      `;
    }

    document.addEventListener("DOMContentLoaded", () => {
      loadMember("F24-1001");
    });
  </script>
</body>
</html>
